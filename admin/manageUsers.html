<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Manage Users – Admin – Avec la Chef</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Bebas+Neue:wght@400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div class="admin-wrap">
  <aside class="admin-sidebar">
    <div class="as-logo">
      <div class="emoji">🍔</div>
      <div class="as-logo-txt"><strong>Avec la Chef</strong><small>Admin</small></div>
    </div>
    <nav class="as-nav">
      <a href="dashboard.html" class="as-link"><i class="fas fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="orders.html" class="as-link"><i class="fas fa-receipt"></i> <span>Orders</span></a>
      <a href="products.html" class="as-link"><i class="fas fa-burger"></i> <span>Products</span></a>
      <a href="bookings.html" class="as-link"><i class="fas fa-calendar-check"></i> <span>Bookings</span></a>
      <a href="customers.html" class="as-link"><i class="fas fa-users"></i> <span>Customers</span></a>
      <a href="manageUsers.html" class="as-link active" id="navManageUsers" style="display:none"><i class="fas fa-user-shield"></i> <span>Manage Users</span></a>
    </nav>
    <div class="as-foot">
      <div class="as-user" id="asUser"></div>
      <button class="as-logout" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> <span>Log Out</span></button>
      <a class="as-back" href="../index.html"><i class="fas fa-arrow-left"></i> <span>Back to site</span></a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <h1>Manage Users</h1>
        <p>Owner-only: create and revoke admin dashboard access</p>
      </div>
    </header>
    <div class="admin-content">

      <h2 class="section-title">Create New Admin</h2>
      <div class="admin-table-wrap" style="padding:20px;margin-bottom:32px">
        <div class="f-row3">
          <div class="fg"><label>Full Name</label><input id="nuName" type="text" placeholder="Jean Mugisha"/></div>
          <div class="fg"><label>Email <span style="color:#e53935">*</span></label><input id="nuEmail" type="email" placeholder="jean@email.com"/></div>
          <div class="fg">
            <label>Password <span style="color:#e53935">*</span></label>
            <div class="pw-wrap">
              <input id="nuPassword" type="password" placeholder="Min 6 characters"/>
              <button type="button" class="pw-toggle" onclick="togPwdAdmin('nuPassword', this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
        </div>
        <button class="btn-admin" id="nuSubmitBtn" onclick="createAdminUser()"><i class="fas fa-user-plus"></i> Create Admin Account</button>
      </div>

      <h2 class="section-title">Promote an Existing Customer</h2>
      <div class="admin-table-wrap" style="padding:20px;margin-bottom:32px">
        <div class="f-row2">
          <div class="fg"><label>Customer's Email</label><input id="puEmail" type="email" placeholder="already-signed-up@email.com"/></div>
        </div>
        <button class="btn-admin ghost" onclick="promoteToAdmin()"><i class="fas fa-arrow-up"></i> Promote to Admin</button>
      </div>

      <h2 class="section-title">Current Admins</h2>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr>
          </thead>
          <tbody id="adminsTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabaseClient.js"></script>
<script src="admin.js"></script>
</body>
</html>
